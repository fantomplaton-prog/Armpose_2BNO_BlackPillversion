# pyproject.toml - манифест пакетов posetracker и pronation_supination
# (оба лежат в этой же папке Python/, ставятся ОДНОЙ командой ниже - второй
# и так зависит от первого через `from posetracker.quat import ...`/
# `from posetracker.ble_link import ...`, отдельный манифест ему не нужен).
#
# ЗАЧЕМ ЭТОТ ФАЙЛ:
# Без него `import posetracker` работает ТОЛЬКО если скрипт-потребитель
# лежит рядом с папкой posetracker/ (Python ищет пакеты в том числе в
# каталоге запускаемого скрипта). Стоит потребителю оказаться в другом
# месте на диске - импорт сломается. Этот файл превращает posetracker в
# полноценный устанавливаемый пакет: команда
#
#     pip install -e .
#
# (запущенная из этой папки, Python/) регистрирует posetracker в текущем
# виртуальном окружении, и `import posetracker` начинает работать из
# ЛЮБОГО скрипта, использующего это окружение - независимо от того, где
# физически лежат файлы. Флаг -e (editable) означает "не копируй файлы
# пакета в окружение, а сошлись на исходники здесь" - удобно, пока сам
# активно правишь код пакета: изменения в .py-файлах видны сразу, без
# переустановки.
#
# Секция [project] - метаданные (имя, версия, зависимости) - в С-мире это
# было бы примерно как объединённые сведения о версии библиотеки + список
# .h-файлов, которые нужно слинковать. Секция [build-system] - служебная,
# указывает pip, каким инструментом ("бэкендом") собирать пакет
# (setuptools - самый распространённый выбор, дальше можно не думать про
# эту секцию).

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "posetracker"
version = "0.1.0"
description = "Определение положения руки относительно тела по двум BNO08x на STM32 (BLE)"
requires-python = ">=3.10"
dependencies = [
    "bleak",
    "numpy",
]

[tool.setuptools]
packages = ["posetracker", "pronation_supination"]
